<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">From hardware to intelligent systems</title>
  <desc id="desc">A dark technical banner with turquoise orbital geometry. Embedded, trading, AI tooling and infrastructure.</desc>
