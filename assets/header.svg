    <text x="283" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#487185">/</text>
    <text x="307" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing="1.9" font-weight="600" fill="#93AABE">AI TOOLING</text>
