      <stop offset="1" stop-color="#36C9C1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43D5C6"/>
      <stop offset="1" stop-color="#43D5C6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="360" rx="16"/></clipPath>
